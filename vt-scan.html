<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نتيجة الفحص | نبيه</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vt-scan.css">
</head>
<body class="ibm-plex-sans-arabic-regular">
  <main class="vt-wrap">
    <header class="vt-head">
      <strong>نبيه</strong>
      <span>فحص الرابط عبر VirusTotal</span>
    </header>

    <section class="nabih-sidebar-card vt-target">
      <p>الرابط الذي تم فحصه</p>
      <code id="vt-url" dir="ltr">—</code>
    </section>

    <section id="vt-state" class="nabih-sidebar-card vt-state" data-state="loading" aria-live="polite">
      <div class="vt-spinner" aria-hidden="true"></div>
      <strong id="vt-title">جارٍ إرسال الرابط…</strong>
      <p id="vt-sub"></p>
    </section>

    <section id="vt-result" hidden>
      <div id="vt-verdict" class="nabih-sidebar-card vt-verdict">
        <strong id="vt-verdict-text"></strong>
        <p id="vt-verdict-desc"></p>
      </div>

      <div class="vt-stats">
        <div class="nabih-sidebar-card nabih-card-email"><p>خبيث</p><strong id="s-malicious">0</strong></div>
        <div class="nabih-sidebar-card nabih-card-payment"><p>مشبوه</p><strong id="s-suspicious">0</strong></div>
        <div class="nabih-sidebar-card nabih-card-password"><p>سليم</p><strong id="s-harmless">0</strong></div>
        <div class="nabih-sidebar-card nabih-card-phone"><p>لم يُكتشف</p><strong id="s-undetected">0</strong></div>
      </div>

      <div id="vt-flagged-box" class="nabih-sidebar-card" hidden>
        <strong>المحركات التي أبلغت عن الرابط</strong>
        <ul id="vt-flagged" class="vt-flagged"></ul>
      </div>

      <a id="vt-report" class="nabih-focus-btn vt-link" target="_blank" rel="noopener noreferrer" hidden>عرض التقرير الكامل في VirusTotal</a>
      <button id="vt-rescan" class="nabih-focus-btn" type="button" hidden>🔄 إعادة الفحص الآن</button>
    </section>
    <button id="vt-back" class="nabih-focus-btn" type="button">رجوع للرئيسية</button>
  </main>
  <script src="vt-scan.js"></script>
</body>
</html>
