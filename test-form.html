<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>صفحة اختبار إضافة نبيه | Nabih Test Page</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
      background: #f1f5f9;
      padding: 40px 20px;
      color: #0f172a;
      direction: rtl;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #0f172a;
    }
    p.subtitle {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 22px;
      position: relative;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13.5px;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    button[type="submit"]:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">🛡️ بيئة اختبار نبيه</span>
    <h2>نموذج تسجيل دخول / حساب جديد</h2>
    <p class="subtitle">
      هذه الصفحة لاختبار الكشف التلقائي عن النماذج، أزرار التنبيه الذكية، ومولّد كلمات المرور، وكذلك التبديل بين وضع الحقول المباشرة والشريط الجانبي.
    </p>

    <form id="login-form" action="/login" method="POST">
      <div class="form-group">
        <label for="user-email">البريد الإلكتروني</label>
        <input type="email" id="user-email" name="email" placeholder="example@domain.com" required />
      </div>

      <div class="form-group">
        <label for="user-password">كلمة المرور</label>
        <input type="password" id="user-password" name="password" placeholder="أدخل كلمة المرور" required />
      </div>

      <div class="form-group">
        <label for="user-phone">رقم الهاتف (اختياري)</label>
        <input type="tel" id="user-phone" name="phone" placeholder="05XXXXXXXX" />
      </div>

      <button type="submit">تسجيل الدخول / إنشاء حساب</button>
    </form>
  </div>

  <script src="content.js"></script>
</body>
</html>
